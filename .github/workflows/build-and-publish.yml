name: Build and Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  prepare-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare external packages
        run: |
          mkdir -p src/packages

          DOWNLOAD_MAX_ATTEMPTS=4

          download_with_retry() {
            name="$1"
            dest="$2"
            shift 2
            attempt=1
            while [ "${attempt}" -le "${DOWNLOAD_MAX_ATTEMPTS}" ]; do
              for url in "$@"; do
                echo "=== download attempt ${attempt}/${DOWNLOAD_MAX_ATTEMPTS}: ${name} ==="
                echo "url: ${url}"
                if curl --fail --location --show-error --connect-timeout 30 --max-time 900 -o "${dest}" "${url}"; then
                  return 0
                fi
                status="$(curl --location --silent --output /dev/null --write-out '%{http_code}' "${url}" || echo curl_failed)"
                echo "ERROR: failed to download ${name} from ${url} (http_status=${status})" >&2
              done
              if [ "${attempt}" -lt "${DOWNLOAD_MAX_ATTEMPTS}" ]; then
                sleep_sec=$((attempt * 20))
                echo "ERROR: retrying ${name} in ${sleep_sec}s..." >&2
                sleep "${sleep_sec}"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          download_package() {
            name="$1"
            cache="$2"
            shift 2
            if ! download_with_retry "${name}" "src/packages/${cache}" "$@"; then
              echo "ERROR: failed to download ${name}" >&2
              echo "ERROR: source_urls=$*" >&2
              return 1
            fi
          }

          download_package "man-pages-ja" \
            "man-pages-ja-20260115.tar.gz" \
            "https://github.com/linux-jm/manual/releases/download/v20260115/man-pages-ja-20260115.tar.gz"

          download_package "pandoc" \
            "pandoc-3.9.0.2-linux-amd64.tar.gz" \
            "https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-linux-amd64.tar.gz"

          download_package "pandoc-crossref" \
            "pandoc-crossref-0.3.24a-Linux-X64.tar.xz" \
            "https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24a/pandoc-crossref-Linux-X64.tar.xz"

          download_package "plantuml" \
            "plantuml-1.2026.2.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v1.2026.2/plantuml-1.2026.2.jar"

          download_package "inkscape" \
            "Inkscape-1.4.4.AppImage" \
            "https://media.inkscape.org/dl/resources/file/Inkscape-1.4.4.AppImage" \
            "https://inkscape.org/gallery/item/59506/Inkscape-1.4.4.AppImage"
          echo "d217fe05c92faaed5c3af46856b6299c98933dc722819cb5bc2ca052c5522166  src/packages/Inkscape-1.4.4.AppImage" | sha256sum -c -

          download_package "Chrome for Testing 148.0.7778.97" \
            "chrome-linux64-148.0.7778.97.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/148.0.7778.97/linux64/chrome-linux64.zip"

          download_package "cloc" \
            "cloc-2.08.pl" \
            "https://github.com/AlDanial/cloc/releases/download/v2.08/cloc-2.08.pl"

          download_package "editorconfig-checker" \
            "ec-linux-amd64-v3.6.1.tar.gz" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v3.6.1/ec-linux-amd64.tar.gz"

          download_package "doxygen" \
            "doxygen-1.15.0.src.tar.gz" \
            "https://doxygen.nl/files/doxygen-1.15.0.src.tar.gz" \
            "https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.src.tar.gz"

          download_package "llvm-project" \
            "llvm-project-22.1.4.src.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.4/llvm-project-22.1.4.src.tar.xz"

          download_package "gh 2.95.0" \
            "gh_2.95.0_linux_amd64.rpm" \
            "https://github.com/cli/cli/releases/download/v2.95.0/gh_2.95.0_linux_amd64.rpm"

          download_package "glab 1.105.0" \
            "glab_1.105.0_linux_amd64.rpm" \
            "https://gitlab.com/gitlab-org/cli/-/releases/v1.105.0/downloads/glab_1.105.0_linux_amd64.rpm"

          for ol_version in 8 9 10; do
            download_package "doxybook2 for el${ol_version}" \
              "doxybook2-linux-el${ol_version}-x64" \
              "https://github.com/Hondarer/doxybook2-bin/raw/main/bin/linux-el${ol_version}-x64/doxybook2"
          done

      - name: Upload external packages
        uses: actions/upload-artifact@v7
        with:
          name: external-packages
          path: src/packages/
          if-no-files-found: error
          retention-days: 1

  build-and-push:
    needs: prepare-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ol_version: ["8", "9", "10"]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download external packages
        uses: actions/download-artifact@v8
        with:
          name: external-packages
          path: src/packages

      - name: Set lowercase repository name
        id: repo
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}/oracle-linux-${{ matrix.ol_version }}-dev' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          SAFE_REF_NAME=$(printf '%s' '${{ github.ref_name }}' | sed 's#[/[:space:]]#-#g')
          echo "WSL_ROOTFS_FILE=oracle-linux-${{ matrix.ol_version }}-dev-${SAFE_REF_NAME}-wsl-rootfs.tar.gz" >> $GITHUB_ENV

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get -y install podman

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Docker Hub credentials
        id: dockerhub-check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Prepare build context (docs)
        run: |
          # README の相対リンクを GitHub 絶対 URL に変換して src/ へ配置
          BASE_BLOB="https://github.com/${{ github.repository }}/blob/main"
          BASE_TREE="https://github.com/${{ github.repository }}/tree/main"
          sed \
            -e "s|](\./\([^)]*\)/)|](${BASE_TREE}/\1/)|g" \
            -e "s|](\./\([^)]*\))|](${BASE_BLOB}/\1)|g" \
            -e "s|](docs-src/\([^)]*\)/)|](${BASE_TREE}/docs-src/\1/)|g" \
            -e "s|](docs-src/)|](${BASE_TREE}/docs-src/)|g" \
            -e "s|](docs-src/\([^)]*\))|](${BASE_BLOB}/docs-src/\1)|g" \
            -e "s|](examples/\([^)]*\)/)|](${BASE_TREE}/examples/\1/)|g" \
            -e "s|](examples/\([^)]*\))|](${BASE_BLOB}/examples/\1)|g" \
            -e "s|](CLAUDE\.md)|](${BASE_BLOB}/CLAUDE.md)|g" \
            README.md > src/README.md

          # LICENSE をビルドコンテキストにコピー
          cp LICENSE src/LICENSE

      - name: Build container image
        run: |
          # 必要なディレクトリを作成
          mkdir -p src/keys src/packages src/fonts

          # container-release の作成
          {
            echo "# Container Build Information"
            printf "%-18s = %s\n" "BUILD_TYPE" "github-actions"
            printf "%-18s = %s\n" "BUILD_DATE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf "%-18s = %s\n" "BUILD_HOST" "$(uname -n 2>/dev/null || echo 'github-runner')"

            # Git コミットハッシュと変更状態の取得
            GIT_COMMIT="${{ github.sha }}"
            git diff-index --quiet HEAD 2>/dev/null || GIT_COMMIT="${GIT_COMMIT}+"
            printf "%-18s = %s\n" "GIT_COMMIT" "${GIT_COMMIT}"

            printf "%-18s = %s\n" "GIT_BRANCH" "${{ github.ref_name }}"

            # タグの取得とバージョン抽出
            if [ "${{ github.ref_type }}" = "tag" ]; then
              printf "%-18s = %s\n" "GIT_TAG" "${{ github.ref_name }}"
              VERSION="${{ github.ref_name }}"
              VERSION="${VERSION#v}"
              printf "%-18s = %s\n" "VERSION" "${VERSION}"
            else
              printf "%-18s = %s\n" "GIT_TAG" "(none)"
              printf "%-18s = %s\n" "VERSION" "dev"
            fi

            printf "%-18s = %s\n" "BUILDER" "${{ github.actor }}"
            printf "%-18s = %s\n" "GITHUB_REPOSITORY" "${{ github.repository }}"
            printf "%-18s = %s\n" "GITHUB_RUN_ID" "${{ github.run_id }}"
            printf "%-18s = %s\n" "GITHUB_RUN_NUMBER" "${{ github.run_number }}"
          } > src/container-release

          cd src
          # OCI イメージラベル: GitHub Packages のパッケージ説明として表示される
          podman build \
            --build-arg OL_VERSION=${{ matrix.ol_version }} \
            --label "org.opencontainers.image.description=Oracle Linux ${{ matrix.ol_version }} development container image with Node.js, Java, .NET, Python, and documentation tools" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Test container image
        run: |
          # コンテナをバックグラウンドで起動
          CONTAINER_ID=$(podman run -d \
            -e HOST_USER=testuser \
            -e HOST_UID=1000 \
            -e HOST_GID=1000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }})

          # entrypoint.sh の処理完了を待つ
          sleep 5

          # コンテナ内でバージョン確認
          echo "=== Oracle Linux version ==="
          OS_MAJOR=$(podman exec $CONTAINER_ID bash -c '. /etc/os-release; echo "${VERSION_ID%%.*}"')
          test "$OS_MAJOR" = "${{ matrix.ol_version }}"

          echo "=== Node.js version ==="
          podman exec $CONTAINER_ID node --version
          test "$(podman exec $CONTAINER_ID node -p 'process.versions.node.split(".")[0]')" = "24"

          echo "=== npm version ==="
          podman exec $CONTAINER_ID npm --version

          echo "=== Java version ==="
          podman exec $CONTAINER_ID java --version

          echo "=== Java 11 version ==="
          JAVA11=$(podman exec $CONTAINER_ID find /usr/lib/jvm -name 'java' -path '*/java-11*' -type f | head -1)
          if [ -n "$JAVA11" ]; then
            podman exec $CONTAINER_ID $JAVA11 --version
          else
            echo "Java 11 not found (skipped)"
          fi

          echo "=== Python version ==="
          podman exec $CONTAINER_ID python --version
          PYTHON_MINOR=$(podman exec $CONTAINER_ID python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')

          case "${{ matrix.ol_version }}" in
            8)
              EXPECTED_JAVA=17
              EXPECTED_PYTHON=3.11
              EXPECTED_GCC=8
              ;;
            9)
              EXPECTED_JAVA=21
              EXPECTED_PYTHON=3.9
              EXPECTED_GCC=11
              ;;
            10)
              EXPECTED_JAVA=21
              EXPECTED_PYTHON=3.12
              EXPECTED_GCC=14
              ;;
          esac

          podman exec $CONTAINER_ID java --version 2>&1 | head -1 | grep -E "^openjdk ${EXPECTED_JAVA}([.[:space:]]|$)"
          test "$PYTHON_MINOR" = "$EXPECTED_PYTHON"
          podman exec $CONTAINER_ID python -m pip --version

          echo "=== GCC version ==="
          GCC_MAJOR=$(podman exec $CONTAINER_ID gcc -dumpversion | cut -d. -f1)
          test "$GCC_MAJOR" = "$EXPECTED_GCC"

          echo "=== Python 3.11 version ==="
          if podman exec $CONTAINER_ID which python3.11 > /dev/null 2>&1; then
            podman exec $CONTAINER_ID python3.11 --version
          else
            echo "python3.11 not found (skipped)"
          fi

          echo "=== OpenSSH version ==="
          podman exec $CONTAINER_ID ssh -V

          echo "=== .NET version ==="
          podman exec $CONTAINER_ID dotnet --version
          podman exec $CONTAINER_ID dotnet --version | grep -E '^10\.'

          echo "=== Doxygen version ==="
          podman exec $CONTAINER_ID doxygen --version

          echo "=== PlantUML version ==="
          podman exec $CONTAINER_ID plantuml -version

          echo "=== doxybook2 version ==="
          podman exec $CONTAINER_ID doxybook2 --help

          echo "=== Disabled build repositories ==="
          ENABLED_REPOS=$(podman exec $CONTAINER_ID dnf repolist --enabled)
          if echo "$ENABLED_REPOS" | grep -E "ol${{ matrix.ol_version }}_(codeready_builder|developer_EPEL)|rpmfusion-free"; then
            echo "Build-only repository is still enabled"
            exit 1
          fi

          echo "=== Chrome for Testing version ==="
          podman exec --user testuser --env HOME=/home/testuser $CONTAINER_ID chrome --version

          echo "=== Chrome for Testing environment ==="
          podman exec --user testuser --env HOME=/home/testuser $CONTAINER_ID bash -lc '
            test "$CHROME_PATH" = /usr/local/bin/chrome
            test "$PUPPETEER_EXECUTABLE_PATH" = /usr/local/bin/chrome
            test "$PUPPETEER_SKIP_DOWNLOAD" = true
            test -x "$CHROME_PATH"
            doxybook2 --help
          '

          echo "=== Marp PDF smoke test ==="
          podman exec --user testuser --env HOME=/home/testuser $CONTAINER_ID \
            marp --pdf --no-config-file \
              /usr/share/doc/oracle-linux-dev-container/README.md \
              -o /tmp/marp-smoke.pdf
          podman exec $CONTAINER_ID test -s /tmp/marp-smoke.pdf

          echo "=== Puppeteer system Chrome smoke test ==="
          podman exec --user testuser --env HOME=/home/testuser $CONTAINER_ID bash -lc '
            test ! -d "$HOME/.cache/puppeteer"
            mkdir /tmp/puppeteer-smoke
            cd /tmp/puppeteer-smoke
            npm init -y >/dev/null
            npm install --no-audit --no-fund puppeteer@24.43.1
            test ! -d "$HOME/.cache/puppeteer"
            node -e '\''
              const puppeteer = require("puppeteer");
              (async () => {
                const browser = await puppeteer.launch({
                  headless: true,
                  args: ["--no-sandbox"],
                });
                const page = await browser.newPage();
                await page.setContent("<title>puppeteer-smoke</title>");
                if ((await page.title()) !== "puppeteer-smoke") process.exit(1);
                await browser.close();
              })().catch((error) => { console.error(error); process.exit(1); });
            '\''
          '

          # sshd が起動しているか確認
          echo "=== Checking sshd process ==="
          podman exec $CONTAINER_ID pgrep sshd
          echo "sshd is running"

          # クリーンアップ
          podman stop $CONTAINER_ID
          podman rm $CONTAINER_ID

      - name: Build WSL derivative image
        run: |
          WSL_BUILD_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-wsl-build"

          cd src
          podman build \
            --build-arg BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.wsl \
            -t "$WSL_BUILD_IMAGE" \
            .

          echo "WSL_BUILD_IMAGE=$WSL_BUILD_IMAGE" >> $GITHUB_ENV

      - name: Test WSL derivative image
        run: |
          podman run --rm --entrypoint /bin/bash "$WSL_BUILD_IMAGE" -lc '
            unset CHROME_PATH PUPPETEER_EXECUTABLE_PATH PUPPETEER_SKIP_DOWNLOAD
            . /etc/profile.d/chrome-for-testing.sh
            test "$CHROME_PATH" = /usr/local/bin/chrome
            test "$PUPPETEER_EXECUTABLE_PATH" = /usr/local/bin/chrome
            test "$PUPPETEER_SKIP_DOWNLOAD" = true
            chrome --version
          '

      - name: Push container image
        if: github.event_name != 'pull_request'
        run: |
          # メタデータから生成されたタグをすべて適用して push
          TAGS="${{ steps.meta.outputs.tags }}"
          for tag in $TAGS; do
            echo "Tagging and pushing: $tag"
            podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} $tag
            podman push $tag
          done

      - name: Push container image to Docker Hub
        if: github.event_name != 'pull_request' && steps.dockerhub-check.outputs.available == 'true'
        run: |
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/oracle-linux-${{ matrix.ol_version }}-dev"
          TAGS="${{ steps.meta.outputs.tags }}"
          for tag in $TAGS; do
            DH_TAG="${DOCKERHUB_IMAGE}:${tag##*:}"
            echo "Tagging and pushing to Docker Hub: $DH_TAG"
            podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} $DH_TAG
            podman push $DH_TAG
          done

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request' && steps.dockerhub-check.outputs.available == 'true'
        run: |
          # src/README.md (リンク変換済み) を Docker Hub description 用にコピー
          cp src/README.md /tmp/dockerhub-readme.md

      - name: Push Docker Hub description
        if: github.event_name != 'pull_request' && steps.dockerhub-check.outputs.available == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/oracle-linux-${{ matrix.ol_version }}-dev
          short-description: Oracle Linux ${{ matrix.ol_version }} dev container with Node.js 24, Java, .NET 10, Python, docs tools, Japanese support
          readme-filepath: /tmp/dockerhub-readme.md

      - name: Export WSL rootfs and upload release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # WSL 用 rootfs のエクスポート
          echo "==> Exporting WSL rootfs..."
          CONTAINER_ID=$(podman create "$WSL_BUILD_IMAGE")
          podman export $CONTAINER_ID | gzip > "$WSL_ROOTFS_FILE"
          podman rm $CONTAINER_ID

          # ファイルサイズを記録
          ls -lh "$WSL_ROOTFS_FILE"

          ROOTFS_SIZE_BYTES=$(stat -c%s "$WSL_ROOTFS_FILE")
          ROOTFS_SIZE_MIB=$((ROOTFS_SIZE_BYTES / 1024 / 1024))
          echo "WSL_ROOTFS_SIZE_BYTES=$ROOTFS_SIZE_BYTES" >> $GITHUB_ENV

          # GitHub Release asset は 1 ファイル 2 GiB 未満が上限
          if [ "$ROOTFS_SIZE_BYTES" -ge 2147483648 ]; then
            echo "WSL rootfs exceeds GitHub Release asset limit: ${ROOTFS_SIZE_BYTES} bytes"
            exit 1
          fi

          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "==> Ensuring GitHub Release exists for tag ${{ github.ref_name }}..."
            if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              gh release create "${{ github.ref_name }}" \
                --repo "${{ github.repository }}" \
                --title "${{ github.ref_name }}" \
                --generate-notes || true
            fi

            LEGACY_WSL_ROOTFS_FILE="OracleLinux${{ matrix.ol_version }}-Dev.tar.gz"
            if gh release view "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --json assets \
              --jq '.assets[].name' | grep -Fx "$LEGACY_WSL_ROOTFS_FILE" > /dev/null; then
              echo "==> Removing legacy GitHub Release asset: $LEGACY_WSL_ROOTFS_FILE"
              gh release delete-asset "${{ github.ref_name }}" "$LEGACY_WSL_ROOTFS_FILE" \
                --repo "${{ github.repository }}" \
                --yes
            fi

            echo "==> Uploading GitHub Release asset: $WSL_ROOTFS_FILE"
            gh release upload "${{ github.ref_name }}" "$WSL_ROOTFS_FILE" \
              --repo "${{ github.repository }}" \
              --clobber
          fi

          echo "==> WSL rootfs export completed"

      - name: Output image information
        if: github.event_name != 'pull_request'
        run: |
          echo "## Container Image Published (OL${{ matrix.ol_version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Image Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### WSL2 Rootfs File" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "$WSL_ROOTFS_FILE" >> $GITHUB_STEP_SUMMARY
            echo "size: ${WSL_ROOTFS_SIZE_BYTES:-unknown} bytes" >> $GITHUB_STEP_SUMMARY
          else
            echo "Skipped for non-tag builds" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull command (Container)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Import to WSL2" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`powershell" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "# 1. Download $WSL_ROOTFS_FILE from the GitHub Release assets" >> $GITHUB_STEP_SUMMARY
            echo "# 2. Download and run the import script" >> $GITHUB_STEP_SUMMARY
            echo "Invoke-WebRequest -Uri https://raw.githubusercontent.com/${{ github.repository }}/main/examples/import-wsl/import-wsl.ps1 -OutFile .\\import-wsl.ps1" >> $GITHUB_STEP_SUMMARY
            echo ".\\import-wsl.ps1 -RootFsPath \"$WSL_ROOTFS_FILE\" -WslDistroName \"OracleLinux${{ matrix.ol_version }}-Dev\"" >> $GITHUB_STEP_SUMMARY
          else
            echo "# WSL rootfs is exported and published on tagged releases only." >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
